name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    # Dummy values only. No real credentials, no network calls to Appwrite or
    # Telegram: builds prerender public pages and never invoke a route handler.
    env:
      NEXT_PUBLIC_APP_URL: https://example.com
      NEXT_PUBLIC_APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: icone
      NEXT_PUBLIC_APPWRITE_BUCKET_ID: bucket
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: icone_app_bot
      NEXT_PUBLIC_APP_VERSION: 1.0.0
      APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: icone
      APPWRITE_API_KEY: ci-placeholder-api-key
      APPWRITE_DATABASE_ID: database
      APPWRITE_BUCKET_ID: bucket
      TELEGRAM_BOT_TOKEN: 123456:ci-placeholder-bot-token
      TELEGRAM_WEBHOOK_SECRET: ci-placeholder-webhook-secret-0001
      CRON_SECRET: ci-placeholder-cron-secret-0001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Dictionary parity
        run: npm run check:i18n

      - name: Build
        run: npm run build
